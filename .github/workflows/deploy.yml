name: Deploy to cPanel via rsync

on:
  push:
    branches:
      - disabled-cpanel  # disabled — using Netlify instead

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SFTP_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo "StrictHostKeyChecking no" >> ~/.ssh/config
      - name: Deploy via rsync
        env:
          SSH_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SSH_HOST: ${{ secrets.SFTP_HOST }}
        run: |
          rsync -avz --delete -e "ssh -i ~/.ssh/id_rsa" out/ ${SSH_USERNAME}@${SSH_HOST}:public_html/
