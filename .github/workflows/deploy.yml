name: Build & Deploy to cPanel via rsync

on:
  push:
    branches:
      - main

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Next.js project
        run: pnpm run build

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SFTP_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo "StrictHostKeyChecking no" >> ~/.ssh/config

      - name: Test SSH connection
        env:
          SSH_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SSH_HOST: ${{ secrets.SFTP_HOST }}
        run: |
          ssh -i ~/.ssh/id_rsa ${SSH_USERNAME}@${SSH_HOST} "echo SSH Connected"

      - name: Deploy via rsync to public_html
        env:
          SSH_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SSH_HOST: ${{ secrets.SFTP_HOST }}
        run: |
          rsync -avz --delete -e "ssh -i ~/.ssh/id_rsa" out/ ${SSH_USERNAME}@${SSH_HOST}:public_html/
